name: Deploy blog to GitHub Pages

# Production: GitHub Pages. PR previews: Vercel. Netlify is not used.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys on main pushes (e.g. merged PRs) or manual runs by the repo owner.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_dispatch' && github.actor == 'chetanraj') ||
      (github.event_name == 'push' && contains(fromJSON('["chetanraj", "cursor[bot]"]'), github.actor))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check npm version (min-release-age needs npm >= 11.10)
        run: |
          npm --version
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<10)) { console.error('npm '+process.argv[1]+' < 11.10: .npmrc min-release-age would be ignored'); process.exit(1) }" "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          dotfiles: true
