name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check npm version (min-release-age needs npm >= 11.10)
        run: |
          npm --version
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<10)) { console.error('npm '+process.argv[1]+' < 11.10: .npmrc min-release-age would be ignored'); process.exit(1) }" "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
