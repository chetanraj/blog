# Netlify configuration for Astro project
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18.20.8"
  NPM_CONFIG_PRODUCTION = "false"
  NETLIFY_CLEAR_CACHE = "true"

# Rewrite rules for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
